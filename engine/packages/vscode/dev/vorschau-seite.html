<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Studio Website</title>
<!-- Die Seite, die das Dock im Vorschau-Harness für index.html zeigt. -->
<style>
  body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f1ea; color: #1c1a17; }
  header { padding: 44px 36px 28px; border-bottom: 1px solid #ddd6c8; }
  h1 { margin: 0 0 8px; font-size: 32px; font-weight: 650; letter-spacing: -.02em; }
  p { margin: 0; color: #6b645a; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; padding: 28px 36px; }
  article { padding: 18px; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px #0000000f; }
  article strong { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>Studio Website</h1>
  <p id="stand">…</p>
</header>
<main>
  <article><strong>Arbeiten</strong>Ausgewählte Projekte</article>
  <article><strong>Studio</strong>Team und Haltung</article>
  <article><strong>Kontakt</strong>Anfragen und Anfahrt</article>
</main>
<script>
  // Erst danach der Stand: ist er zu sehen, ist die Nachricht längst verarbeitet.
  setTimeout(() => {
    const visits = Number(localStorage.getItem('studio.besuche') || 0) + 1;
    localStorage.setItem('studio.besuche', String(visits));
    document.getElementById('stand').textContent = `Skript läuft · Besuch ${visits}`;
  }, 80);
</script>
</body>
</html>
