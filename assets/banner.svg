<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Cortex — one workstation for Claude Code, Codex and Grok">
  <defs>
    <radialGradient id="glow" cx="1060" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="#0B0C0E"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- Motif: three docked panes (projects · chat · tools) inside concentric rounded squares -->
    <g fill="none" stroke="#A78BFA">
      <rect x="880" y="40" width="280" height="280" rx="40" stroke-opacity="0.10"/>
      <rect x="910" y="70" width="220" height="220" rx="32" stroke-opacity="0.16"/>
      <rect x="940" y="100" width="160" height="160" rx="24" stroke-opacity="0.24"/>
    </g>
    <g fill="#A78BFA">
      <rect x="960" y="120" width="28" height="120" rx="8" fill-opacity="0.14"/>
      <rect x="996" y="120" width="48" height="120" rx="8" fill-opacity="0.30"/>
      <rect x="1052" y="120" width="28" height="120" rx="8" fill-opacity="0.14"/>
      <rect x="1004" y="134" width="32" height="6" rx="3" fill-opacity="0.55"/>
      <rect x="1004" y="148" width="24" height="6" rx="3" fill-opacity="0.40"/>
      <rect x="1004" y="162" width="28" height="6" rx="3" fill-opacity="0.40"/>
      <rect x="1012" y="220" width="24" height="10" rx="5" fill-opacity="0.60"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="80" y="170" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="600" letter-spacing="-3" fill="#EEF0F1">Cortex</text>
  <text x="82" y="222" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#9AA4AD">Claude Code, Codex and Grok in one Mac workstation.</text>

  <rect x="82" y="268" width="18" height="4" rx="2" fill="#A78BFA"/>
  <text x="114" y="276" font-family="'SF Mono', Menlo, monospace" font-size="16" letter-spacing="2.5" fill="#64727C">MACOS · YOUR OWN SUBSCRIPTIONS · MIT</text>
</svg>
